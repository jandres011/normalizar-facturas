# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Python project to Azure Function App - fa-aeu-avvale-normalizarfacturas

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # FIX 1: Instalar dependencias en .python_packages/ (carpeta estándar de Azure Functions)
      # Esto reemplaza el venv — Azure espera dependencias en esta ruta específica
      - name: Install dependencies into .python_packages
        run: |
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      # FIX 2: Zip solo lo necesario, excluir explícitamente venv, tests, __pycache__, etc.
      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            --exclude "*.git*" \
            --exclude "*venv/*" \
            --exclude "*__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "*tests/*" \
            --exclude "*.pytest_cache*" \
            --exclude "*.coverage*" \
            --exclude "*htmlcov/*" \
            --exclude "*.env*" \
            --exclude "*local.settings.json"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A478386592042FAB800E00480D12C38 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_12A8DBAC15374127864C686E7430A2A9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5A26500678AE468EB1FF9AAD7DAADBAB }}

      # FIX 3: Deploy directo del zip sin descomprimir — functions-action lo maneja solo
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'fa-aeu-avvale-normalizarfacturas'
          slot-name: 'Production'
          package: 'release.zip'
          # FIX 4: SCM_DO_BUILD_DURING_DEPLOYMENT desactivado porque ya incluimos .python_packages
          # Si preferís que Azure instale las deps, borrá .python_packages del zip y activá esto:
          # scm-do-build-during-deployment: true
